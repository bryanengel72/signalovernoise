name: CI

# Fast feedback on every push and pull request.
#
# This does NOT by itself stop a bad deploy — Vercel builds from the push, not
# from this run. The actual gate is in vercel.json, whose buildCommand runs the
# same lint and tests before it builds, so a failing test fails the deploy.
#
# To make this workflow a gate too, enable branch protection on `main` in the
# repository settings and require the "verify" check to pass. That only bites if
# changes reach main through a pull request rather than a direct push.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the Node version Vercel builds with.
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
