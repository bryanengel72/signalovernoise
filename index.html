<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Signal Over Noise AI | AI Automation Consulting for B2B</title>
    <meta name="description" content="Signal Over Noise AI is a forward-deployed AI engineering consultancy for mid-market B2B. We map how your work really runs, then build AI agents inside the systems you already use. 90-day proof. Less noise. More signal." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.signalovernoiseai.com/" />

    <!-- Open Graph (LinkedIn, Slack, iMessage previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.signalovernoiseai.com/" />
    <meta property="og:title" content="Signal Over Noise AI | AI Automation Consulting for B2B" />
    <meta property="og:description" content="Practical AI implementation for mid-market B2B. Custom AI agents, workflow automation &amp; clear 90-day roadmaps. Built by a practitioner, not a pundit." />
    <meta property="og:image" content="https://www.signalovernoiseai.com/og-image.png" />
    <meta property="og:image:secure_url" content="https://www.signalovernoiseai.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Signal Over Noise AI — AI automation consulting for mid-market B2B" />
    <meta property="og:site_name" content="Signal Over Noise AI" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Signal Over Noise AI | AI Automation Consulting for B2B" />
    <meta name="twitter:description" content="Practical AI implementation for mid-market B2B. Custom AI agents, workflow automation &amp; clear 90-day roadmaps." />
    <meta name="twitter:image" content="https://www.signalovernoiseai.com/og-image.png" />

    <!-- Schema.org structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "name": "%SITE_NAME%",
      "url": "%SITE_URL%",
      "description": "Forward-deployed AI engineering and automation consulting for mid-market B2B companies. Process mapping, custom AI agents, workflow automation, and AI strategy roadmaps.",
      "founder": {
        "@type": "Person",
        "name": "%FOUNDER%",
        "jobTitle": "%FOUNDER_TITLE%",
        "sameAs": ["%LINKEDIN%"]
      },
      "areaServed": "US",
      "serviceType": [
        "AI Automation Consulting",
        "Forward-Deployed AI Engineering",
        "Business Process Mapping",
        "Custom AI Agents",
        "Workflow Automation",
        "AI Strategy & Roadmap"
      ],
      "email": "%EMAIL%",
      "sameAs": ["%LINKEDIN%"]
    }
    </script>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- The page is pre-rendered, but its entrance animations start hidden
         (opacity 0) until JavaScript runs. Without JavaScript, show everything. -->
    <noscript>
      <style>
        #root [style*="opacity:0"] { opacity: 1 !important; transform: none !important; filter: none !important; }
      </style>
    </noscript>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
