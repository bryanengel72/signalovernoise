<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Signal Over Noise AI | AI for Professional Services Firms</title>
    <meta name="description" content="AI automation for accounting firms, law firms, insurance agencies, and consultancies with 10 to 100 people. Less admin, more clients, same team. Fixed prices." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.signalovernoiseai.com/" />

    <!-- Open Graph (LinkedIn, Slack, iMessage previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.signalovernoiseai.com/" />
    <meta property="og:title" content="Signal Over Noise AI | AI for Professional Services Firms" />
    <meta property="og:description" content="We find the hours your firm loses to intake, document prep, reporting, and email, and build AI that wins them back. Fixed prices, no lock-in." />
    <meta property="og:image" content="https://www.signalovernoiseai.com/og-image-v2.png" />
    <meta property="og:image:secure_url" content="https://www.signalovernoiseai.com/og-image-v2.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Signal Over Noise AI — AI automation for professional services firms" />
    <meta property="og:site_name" content="Signal Over Noise AI" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Signal Over Noise AI | AI for Professional Services Firms" />
    <meta name="twitter:description" content="AI automation for professional services firms. Less admin, more clients, same team. Fixed prices, no lock-in." />
    <meta name="twitter:image" content="https://www.signalovernoiseai.com/og-image-v2.png" />

    <!-- Schema.org structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "name": "%SITE_NAME%",
      "url": "%SITE_URL%",
      "description": "AI automation consulting for professional services firms: accounting, law, insurance, and consulting firms with 10 to 100 people. Workflow assessments, automation builds, and monthly support at fixed prices.",
      "audience": {
        "@type": "BusinessAudience",
        "audienceType": "Professional services firms"
      },
      "founder": {
        "@type": "Person",
        "name": "%FOUNDER%",
        "jobTitle": "%FOUNDER_TITLE%",
        "sameAs": ["%LINKEDIN%"]
      },
      "areaServed": "US",
      "serviceType": [
        "AI Automation Consulting",
        "Workflow Assessment",
        "Business Process Automation",
        "Custom AI Agents",
        "AI Training"
      ],
      "email": "%EMAIL%",
      "sameAs": ["%LINKEDIN%"]
    }
    </script>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- The page is pre-rendered, but its entrance animations start hidden
         (opacity 0) until JavaScript runs. Without JavaScript, show everything. -->
    <noscript>
      <style>
        #root [style*="opacity:0"] { opacity: 1 !important; transform: none !important; filter: none !important; }
      </style>
    </noscript>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
